apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestfarma-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestfarma-db
  template:
    metadata:
      labels:
        app: gestfarma-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: gestfarma-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: gestfarma-db-pvc
