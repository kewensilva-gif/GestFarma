apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestfarma-redis
  labels:
    app: gestfarma-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestfarma-redis
  template:
    metadata:
      labels:
        app: gestfarma-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
