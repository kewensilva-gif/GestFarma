apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gestfarma-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestfarma-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestfarma-db
  template:
    metadata:
      labels:
        app: gestfarma-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: gestfarma-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: gestfarma-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gestfarma-db
spec:
  selector:
    app: gestfarma-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
